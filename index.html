<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>高校通讯录 · 杭州职业技术大学</title>
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233B8BFF'/%3E%3Cstop offset='1' stop-color='%230052D0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='192' height='192' rx='44' fill='url(%23g)'/%3E%3Cg fill='%23ffffff'%3E%3Ccircle cx='96' cy='72' r='24'/%3E%3Cpath d='M50 138c6.5-26 25-40 46-40s39.5 14 46 40a5 5 0 0 1-4.8 6.6H54.8A5 5 0 0 1 50 138Z'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <!-- SheetJS 用于解析 / 导出 Excel（本地托管，避免国内 CDN 不稳定） -->
  <script src="xlsx.full.min.js"></script>
</head>
<body>
  <!-- 手机模拟容器 -->
  <div class="phone" id="phone">
    <!-- 顶部状态栏（固定，不随页面滑动） -->
    <div class="statusbar" id="statusbar">
      <span class="sb-time" id="sbTime">22:40</span>
      <span class="sb-notch"></span>
      <span class="sb-right">
        <!-- 信号 -->
        <svg class="sb-ico" viewBox="0 0 18 12" width="18" height="12" aria-hidden="true">
          <rect x="0"  y="8" width="3" height="4"  rx="1" fill="currentColor"/>
          <rect x="5"  y="5" width="3" height="7"  rx="1" fill="currentColor"/>
          <rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/>
          <rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".25"/>
        </svg>
        <!-- WiFi -->
        <svg class="sb-ico" viewBox="0 0 16 12" width="16" height="12" aria-hidden="true">
          <path d="M8 2.2c2.6 0 5 1 6.8 2.7l-1.4 1.5A7.6 7.6 0 0 0 8 4.2 7.6 7.6 0 0 0 2.6 6.4L1.2 4.9A9.8 9.8 0 0 1 8 2.2Z" fill="currentColor"/>
          <path d="M8 5.6c1.7 0 3.3.7 4.5 1.8l-1.5 1.5A4.4 4.4 0 0 0 8 7.5 4.4 4.4 0 0 0 5 8.9L3.5 7.4A6.8 6.8 0 0 1 8 5.6Z" fill="currentColor"/>
          <circle cx="8" cy="10.4" r="1.6" fill="currentColor"/>
        </svg>
        <!-- 电池 -->
        <span class="battery"><span class="battery-fill"></span></span>
      </span>
    </div>

    <!-- 屏幕区域：承载滑动的页面 -->
    <div class="screen" id="screen"></div>

    <!-- 口令锁屏（会话内解锁后隐藏） -->
    <div class="lock-screen" id="lockScreen" hidden>
      <div class="lock-inner">
        <div class="lock-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="8.2" r="4.2"/>
            <path d="M4.6 19.3c1.4-5.1 4.5-7.3 7.4-7.3s6 2.2 7.4 7.3a1 1 0 0 1-1 1.3H5.6a1 1 0 0 1-1-1.3Z"/>
          </svg>
        </div>
        <div class="lock-title">高校通讯录</div>
        <div class="lock-sub">杭州职业技术大学</div>
        <div class="lock-card" id="lockCard">
          <div class="lock-field" id="lockField">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="11" rx="2"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input type="password" id="lockInput" placeholder="请输入口令" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
          </div>
          <button class="lock-btn" id="lockBtn" type="button">解锁</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 模态层 -->
  <div class="modal-layer" id="modalLayer"></div>

  <!-- 轻提示 -->
  <div class="toast" id="toast"></div>

  <!-- 隐藏的文件选择器 -->
  <input type="file" id="excelInput" accept=".xlsx,.xls" hidden />

  <!-- 种子数据：Excel 全量导入结果（window.SEED_DATA），先于 app.js 加载 -->
  <script src="seed-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
